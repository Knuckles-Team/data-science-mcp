[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-mcp"
version = "0.23.0"
description = "Data Science MCP Server — Model training, evaluation, and evolution tools for agentic ML workflows. Integrates with agent-utilities IModelEvolver (CONCEPT:AHE-3.15)."
readme = "README.md"
authors = [{ name = "Audel Rouhi", email = "knucklessg1@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "agent-utilities[mcp]>=0.47.0",
    "epistemic-graph[datascience]>=0.27.0",
    "polars>=1.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
agent = [
    "agent-utilities[agent,logfire]>=0.47.0"]

# scikit-learn is no longer used for compute (that runs in the epistemic-graph
# Rust engine). It is optional and only powers the built-in sample-dataset
# loaders (iris/diabetes/wine/...). CSV datasets need no scikit-learn.
datasets = [
    "scikit-learn>=1.5.0"]

# Wave-C gradient trainers (SFT/DPO/GRPO/pretrain) + LoRA/QLoRA adapters + vLLM
# rollouts + corpus streaming/curation + tokenizer training + 🤗 Accelerate
# (FSDP/single-GPU AMP). Heavy, GPU-oriented; imported lazily so the package
# installs/imports without it. On Blackwell (GB10, sm_120) pin CUDA-12.6+/cu12x
# Blackwell-enabled builds.
training = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
    "tokenizers>=0.19.0",
    "httpx>=0.27.0"]

# Multi-GPU / multi-node scale-out. DeepSpeed ZeRO-3 + FlashAttention-2 are
# GPU-HOST installs (need nvcc/CUDA toolchain); NOT CI/CPU-installable. FSDP needs
# no extra beyond `training` (it ships with accelerate+torch).
training-scale = [
    "deepspeed>=0.14.0",
    "flash-attn>=2.6.0"]

# Fused Triton kernels (RMSNorm/SwiGLU/fused-CE) for throughput on supported archs.
training-fast = [
    "liger-kernel>=0.3.0"]

# Standardized benchmark scoring alongside the AHE-3.1 reliability suite.
eval = [
    "lm-eval>=0.4.0"]

# Experiment tracking. MLflow (self-hostable; the homelab default) and/or W&B.
tracking = [
    "mlflow>=2.14.0"]

all = [
    "agent-utilities[mcp,agent,logfire]>=0.47.0",
    "epistemic-graph[datascience]>=0.27.0",
    "scikit-learn>=1.5.0"]

[project.scripts]
data-science-mcp = "data_science_mcp.mcp_server:mcp_server"
data-science-agent = "data_science_mcp.agent_server:agent_server"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
data_science_mcp = [ "mcp_config.json", "agent/**", "skills/**"]

[tool.vulture]
ignore_names = ["request", "config"]
