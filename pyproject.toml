[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-mcp"
version = "2.0.0"
description = "Data Science MCP Server — Model training, evaluation, and evolution tools for agentic ML workflows. Integrates with agent-utilities IModelEvolver (CONCEPT:AHE-3.15)."
readme = "README.md"
authors = [{ name = "Audel Rouhi", email = "knucklessg1@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "agent-utilities[mcp]>=1.27.1,<2.0.0",
    "epistemic-graph[full]>=2.0.0",
    "polars>=1.43.0",
    "numpy>=2.5.1",
]

[project.optional-dependencies]
mcp = [
    "agent-utilities[mcp]>=1.27.1,<2.0.0"]

agent = [
    "agent-utilities[agent-runtime,logfire]>=1.27.1,<2.0.0"]

# scikit-learn is no longer used for compute (that runs in the epistemic-graph
# Rust engine). It is optional and only powers the built-in sample-dataset
# loaders (iris/diabetes/wine/...). CSV datasets need no scikit-learn.
datasets = [
    "scikit-learn>=1.9.0"]

# Wave-C gradient trainers (SFT/DPO/GRPO/pretrain) + LoRA/QLoRA adapters +
# served-model rollouts/eval over an OpenAI-compatible inference server (vLLM or
# SGLang — client-only via `httpx`; the engine runs out-of-process, selected with
# INFERENCE_BACKEND/INFERENCE_BASE_URL, see `data_science_mcp/inference/`) +
# corpus streaming/curation + tokenizer training + 🤗 Accelerate (FSDP/single-GPU
# AMP). Heavy, GPU-oriented; imported lazily so the package installs/imports
# without it. On Blackwell (GB10, sm_120) pin CUDA-12.6+/cu12x Blackwell builds.
training = [
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "peft>=0.19.1",
    "bitsandbytes>=0.49.2",
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    # CONCEPT:PHASE2-RECONCILE — capped under 0.23.1 (the modernize-bump floor
    # collided with the fleet's transformers/datasets pins).
    "tokenizers<=0.23.0",
    "httpx>=0.28.1",
    # CONCEPT:KG-2.6 — re-homed TradingLSTM walk-forward trainer
    # (data_science_mcp/training/trading_lstm.py) needs StandardScaler + metrics.
    "scikit-learn>=1.9.0"]

# Multi-GPU / multi-node scale-out. DeepSpeed ZeRO-3 + FlashAttention-2 are
# GPU-HOST installs (need nvcc/CUDA toolchain); NOT CI/CPU-installable. FSDP needs
# no extra beyond `training` (it ships with accelerate+torch).
training-scale = [
    "deepspeed>=0.19.2",
    "flash-attn>=2.8.3.post1"]

# Fused Triton kernels (RMSNorm/SwiGLU/fused-CE) for throughput on supported archs.
training-fast = [
    "liger-kernel>=0.8.0"]

# Standardized benchmark scoring alongside the AHE-3.1 reliability suite.
# LightEval replaces lm-eval: the latter still requires sqlitedict, whose
# pickle-backed cache has no safe release. LightEval provides the same standard
# task families without admitting an unsafe deserializer into the runtime.
eval = [
    "lighteval>=0.13.0"]

# Experiment tracking. MLflow (self-hostable; the homelab default) and/or W&B.
tracking = [
    "mlflow>=3.14.0"]

all = [
    "agent-utilities[mcp,agent-runtime,logfire]>=1.27.1,<2.0.0",
    "epistemic-graph[full]>=2.0.0",
    "scikit-learn>=1.9.0"]

[project.scripts]
data-science-mcp = "data_science_mcp.mcp_server:mcp_server"
data-science-agent = "data_science_mcp.agent_server:agent_server"

[tool.setuptools.packages.find]
where = ["."]

[project.entry-points."agent_utilities.skill_providers"]
data-science-mcp = "data_science_mcp.skills"

[project.entry-points."agent_utilities.ontology_providers"]
data-science-mcp = "data_science_mcp.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
data-science-mcp = "data_science_mcp.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
data-science-mcp = "data_science_mcp.prompts"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
data_science_mcp = [ "mcp_config.json", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv]
# LightEval 0.13 unnecessarily pins the vulnerable NLTK 3.9.1 release. NLTK
# 3.10 retains the public tokenizer/corpus APIs LightEval uses and clears the
# affected archive/resource-loading implementations.
override-dependencies = ["nltk>=3.10.0"]
