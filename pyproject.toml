[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-mcp"
version = "0.9.0"
description = "Data Science MCP Server — Model training, evaluation, and evolution tools for agentic ML workflows. Integrates with agent-utilities IModelEvolver (CONCEPT:AHE-3.15)."
readme = "README.md"
authors = [{ name = "Audel Rouhi", email = "knucklessg1@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.10"
dependencies = [
    "agent-utilities[mcp]>=0.18.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
agent = [
    "agent-utilities[agent,logfire]>=0.18.0"]


all = [
    "agent-utilities[mcp,agent,logfire]>=0.18.0"]

[project.scripts]
data-science-mcp = "data_science_mcp.mcp_server:mcp_server"
data-science-agent = "data_science_mcp.agent_server:agent_server"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
data_science_mcp = [ "mcp_config.json", "agent/**", "skills/**"]

[tool.vulture]
ignore_names = ["request", "config"]
