name: Connector PR

on: pull_request

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Knuckles-Team/pipelines/.github/workflows/connector_pr_pipeline.yml@main
    with:
      # the GPU extras (training, training-scale, training-fast) do not install on a CPU runner (flash-attn needs torch at build time).
      sync-args: --all-groups --extra mcp --extra datasets --extra test
